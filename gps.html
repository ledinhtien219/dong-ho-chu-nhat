<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lấy GPS cho Smart Clock</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf0f4;color:#1e2430;font-family:system-ui,sans-serif}.card{width:min(92vw,460px);padding:28px;border:1px solid #dce1e7;border-radius:22px;background:#fff;box-shadow:0 18px 50px #23324b18}h1{margin:0 0 12px;font-size:25px}p{color:#697384;line-height:1.55}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#4e80ff;margin-right:8px}.error{color:#bd2c36}button{width:100%;border:0;border-radius:14px;padding:15px;background:#4e80ff;color:#fff;font-weight:850;font-size:16px}
  </style>
</head>
<body><main class="card"><h1><span class="dot"></span>GPS Smart Clock</h1><p id="status">Nhấn nút dưới và chọn <b>Cho phép vị trí chính xác</b>. Điện thoại sẽ tự quay về ESP32.</p><button id="go">LẤY VỊ TRÍ CHÍNH XÁC</button></main>
<script>
const status=document.getElementById('status'),button=document.getElementById('go');
const device=new URLSearchParams(location.search).get('device');
button.onclick=()=>{if(!device||!/^http:\/\/192\.168\.|^http:\/\/10\.|^http:\/\/172\.(1[6-9]|2\d|3[01])\./.test(device)){status.className='error';status.textContent='Địa chỉ ESP32 không hợp lệ. Hãy mở lại trang cài đặt trên ESP32.';return}button.disabled=true;status.textContent='Đang xin quyền GPS...';navigator.geolocation.getCurrentPosition(p=>{const target=device+'/gps-apply?lat='+p.coords.latitude.toFixed(6)+'&lon='+p.coords.longitude.toFixed(6);status.textContent='Đã có GPS (sai số '+Math.round(p.coords.accuracy)+' m). Đang gửi về ESP32...';location.href=target},e=>{button.disabled=false;status.className='error';status.textContent='Không lấy được GPS: '+e.message+'. Hãy bật Vị trí và cấp quyền cho trình duyệt.'},{enableHighAccuracy:true,timeout:20000,maximumAge:0})};
</script></body></html>
